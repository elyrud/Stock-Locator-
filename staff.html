<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff accounts | BEC TECH Stock Locator</title><link rel="stylesheet" href="theme.css"></head>
<body><main class="shell"><header class="top"><div class="brand"><img class="auth-logo" src="assets/leeds-beckett-university-logo.svg" width="180" height="76" alt="Leeds Beckett University"><div><h1>BEC TECH Stock Locator</h1><p>Staff accounts</p></div></div><a href="index.html">Back to stock locator</a></header>
<section class="component-finder"><h2>Manage staff access</h2><p>Invite a colleague using their email address. Share the generated link privately; it expires after 24 hours and can be used once.</p>
<form id="inviteForm"><label for="staffEmail">Colleague's email address</label><input class="account-input" id="staffEmail" type="email" autocomplete="off" required><label for="inviteKind">Action</label><select class="account-input" id="inviteKind"><option value="invite">Invite a new staff member</option><option value="reset">Reset an existing password</option></select><button class="btn primary" type="submit">Create private link</button></form>
<div id="privateLink" hidden><label for="inviteLink">Private link — copy and send directly to your colleague</label><input class="account-input" id="inviteLink" type="text" readonly><button class="btn secondary" id="copyInvite" type="button">Copy link</button></div><p id="staffMessage" role="status" aria-live="polite"></p></section>
<section class="component-finder"><h2>Staff accounts</h2><div id="staffList"></div></section></main><script src="staff.js"></script></body></html>
